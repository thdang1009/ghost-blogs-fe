name: Deploy Frontend to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Inject secrets into environment.prod.ts
        run: |
          sed -i "s|GA_CODE_PLACEHOLDER|${{ secrets.GA_CODE }}|g" src/environments/environment.prod.ts
          sed -i "s|FB_APP_ID_PLACEHOLDER|${{ secrets.FB_APP_ID }}|g" src/environments/environment.prod.ts

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Package for staging
        run: |
          mkdir -p dangtrinh-ssr-staging
          cp -r ./dist/ghost-blogs-fe/* dangtrinh-ssr-staging/

      - name: Upload to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: dangtrinh-ssr-staging
          target: /var/www

      - name: Swap directories and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf /var/www/dangtrinh-ssr-old
            [ -d /var/www/dangtrinh-ssr ] && mv /var/www/dangtrinh-ssr /var/www/dangtrinh-ssr-old
            mv /var/www/dangtrinh-ssr-staging /var/www/dangtrinh-ssr
            pm2 delete ghost-blogs-fe 2>/dev/null || true
            pm2 start /var/www/dangtrinh-backend/ecosystem.config.js --only ghost-blogs-fe
            pm2 save
            rm -rf /var/www/dangtrinh-ssr-old
            echo "Frontend deployed successfully"
